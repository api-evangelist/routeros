aid: routeros
name: RouterOS
description: >-
  RouterOS is MikroTik's powerful network operating system designed for managing routers, switches, access points, and
  other network devices. It provides a comprehensive REST API (v7.1+) and a TCP-based binary API for programmatic
  management of IP addresses, interfaces, firewall rules, routing, VPN configurations, DHCP, DNS, and system resources.
  RouterOS powers MikroTik hardware and can also be deployed as a virtual machine (CHR).
type: Index
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/routeros.png
tags:
  - Networking
  - Routers
  - Network Management
  - Firewall
  - MikroTik
url: https://raw.githubusercontent.com/api-evangelist/routeros/refs/heads/main/apis.yml
created: '2024-11-07'
modified: '2026-05-19'
specificationVersion: '0.19'
apis:
- aid: routeros:routeros-tcp-api
  name: RouterOS TCP API
  description: >-
    The RouterOS TCP API is the native binary protocol for RouterOS, running on TCP port 8728 (standard)
    and TCP port 8729 (SSL/TLS). It uses a sentence-based word protocol with variable-length encoding,
    supporting tagged concurrent commands, streaming changes via /listen, and cancellation. Used by most
    RouterOS client libraries (Python, PHP, Java, Go, etc.).
  humanURL: https://help.mikrotik.com/docs/spaces/ROS/pages/47579160/API
  baseURL: tcp://{router-ip}:8728
  version: 6.43+
  tags:
  - Networking
  - Router Management
  - TCP API
  - Binary Protocol
  properties:
  - url: https://help.mikrotik.com/docs/spaces/ROS/pages/47579160/API
    type: Documentation
  - url: https://wiki.mikrotik.com/wiki/Manual:API
    type: Documentation
